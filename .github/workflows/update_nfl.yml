name: Update NFL EPA
on:
  schedule:
    - cron: "43 9 * * 2,3,5"   # Tue/Wed/Fri mornings UTC (after MNF, TNF, and mid-week corrections)
  workflow_dispatch:
permissions:
  contents: write
concurrency: nfl-update
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_nfl.py
      - name: Commit changes
        run: |
          git config user.name "nfl-epa-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/nfl
          git diff --cached --quiet || git commit -m "Update NFL EPA"
          git pull --rebase -q origin main && git push
